services:
  proxy-pool:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/proxies.db
      CHECK_CONCURRENCY: "200"
      CHECK_TIMEOUT_SECONDS: "2"
      FETCH_INTERVAL_SECONDS: "60"
      CHECK_INTERVAL_SECONDS: "10"
      STALE_AFTER_SECONDS: "60"
    volumes:
      - proxy-data:/data

volumes:
  proxy-data:
