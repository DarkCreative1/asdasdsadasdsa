name: Proxy pool refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    concurrency:
      group: proxy-refresh
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch, check and export snapshot
        env:
          DATABASE_PATH: data/actions.db
        run: node scripts/refresh_snapshot.js
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/proxies.json data/proxies.txt
          git diff --cached --quiet || git commit -m "fix: handle broken proxies without stopping github actions"
          git push

